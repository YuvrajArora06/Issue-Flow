<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title description">
  <title id="title">Merge Sort and Quick Sort operations on sorted adversarial inputs</title>
  <desc id="description">A logarithmic line chart. Quick Sort operation count rises much faster than Merge Sort for sorted inputs of 100, 500, and 1000 issues.</desc>
  <rect width="920" height="520" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Sorted-input benchmark: operation count (log scale)</text>
  <text x="460" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">The Quick Sort implementation uses the final element as pivot; sorted input is its adversarial case.</text>
  <line x1="100" y1="90" x2="100" y2="420" stroke="#111827" stroke-width="2"/>
  <line x1="100" y1="420" x2="850" y2="420" stroke="#111827" stroke-width="2"/>
  <g stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="360" x2="850" y2="360"/>
    <line x1="100" y1="300" x2="850" y2="300"/>
    <line x1="100" y1="240" x2="850" y2="240"/>
    <line x1="100" y1="180" x2="850" y2="180"/>
    <line x1="100" y1="120" x2="850" y2="120"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#374151">
    <text x="88" y="424" text-anchor="end">10²</text>
    <text x="88" y="364" text-anchor="end">10³</text>
    <text x="88" y="304" text-anchor="end">10⁴</text>
    <text x="88" y="244" text-anchor="end">10⁵</text>
    <text x="88" y="184" text-anchor="end">10⁶</text>
    <text x="88" y="124" text-anchor="end">10⁷</text>
    <text x="230" y="446" text-anchor="middle">100 issues</text>
    <text x="475" y="446" text-anchor="middle">500 issues</text>
    <text x="720" y="446" text-anchor="middle">1000 issues</text>
  </g>
  <polyline points="230,285 475,244 720,224" fill="none" stroke="#2563eb" stroke-width="4"/>
  <polyline points="230,238 475,146 720,112" fill="none" stroke="#dc2626" stroke-width="4"/>
  <g fill="#2563eb"><circle cx="230" cy="285" r="6"/><circle cx="475" cy="244" r="6"/><circle cx="720" cy="224" r="6"/></g>
  <g fill="#dc2626"><circle cx="230" cy="238" r="6"/><circle cx="475" cy="146" r="6"/><circle cx="720" cy="112" r="6"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#111827">
    <text x="230" y="276" text-anchor="middle">1,344</text>
    <text x="475" y="235" text-anchor="middle">8,976</text>
    <text x="720" y="215" text-anchor="middle">19,952</text>
    <text x="230" y="229" text-anchor="middle">15,147</text>
    <text x="475" y="137" text-anchor="middle">375,747</text>
    <text x="720" y="103" text-anchor="middle">1,501,497</text>
  </g>
  <rect x="610" y="474" width="16" height="4" fill="#2563eb"/><text x="634" y="479" font-family="Arial, sans-serif" font-size="13">Merge Sort</text>
  <rect x="750" y="474" width="16" height="4" fill="#dc2626"/><text x="774" y="479" font-family="Arial, sans-serif" font-size="13">Quick Sort</text>
</svg>
